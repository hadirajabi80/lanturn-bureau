name: Deploy

# Every push to main/master: test → build a Docker image → push to GHCR → run it on the server on port 5050.
on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/floorplans
  CONTAINER: floorplans
  HOST_PORT: "5050"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run grid:test

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: vars
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.vars.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    runs-on: ubuntu-latest
    environment:
      name: production
      url: http://167.233.87.63:5050
    steps:
      - name: Prepare and validate the SSH key
        id: sshkey
        env:
          RAW_KEY: ${{ secrets.SSH_KEY }}
          B64_KEY: ${{ secrets.SSH_KEY_B64 }}
          HAS_PASSWORD: ${{ secrets.SSH_PASSWORD != '' }}
        run: |
          set -e
          KEYFILE="$RUNNER_TEMP/deploy_key"
          if [ -n "$B64_KEY" ]; then
            printf '%s' "$B64_KEY" | tr -d ' \r\n' | base64 -d > "$KEYFILE" || { echo "::error::SSH_KEY_B64 is not valid base64"; exit 1; }
          elif [ -n "$RAW_KEY" ]; then
            # normalise Windows line endings and stray indentation from copy/paste
            printf '%s\n' "$RAW_KEY" | tr -d '\r' | sed 's/^[[:space:]]*//' > "$KEYFILE"
          elif [ "$HAS_PASSWORD" = "true" ]; then
            echo "Using SSH_PASSWORD (no key secret set)."; echo "path=" >> "$GITHUB_OUTPUT"; exit 0
          else
            echo "::error::No SSH_KEY, SSH_KEY_B64 or SSH_PASSWORD secret is set."; exit 1
          fi
          chmod 600 "$KEYFILE"
          LINES=$(wc -l < "$KEYFILE"); FIRST=$(head -n1 "$KEYFILE" | cut -c1-40)
          case "$FIRST" in -----BEGIN*) ;; *) FIRST="(no BEGIN header line — key material redacted)";; esac
          if ! ssh-keygen -y -f "$KEYFILE" > /dev/null 2>&1; then
            echo "::error::The SSH key secret is not a valid private key. Lines: $LINES. First line: $FIRST. Did you paste the .pub file, or lose the BEGIN/END lines?"
            exit 1
          fi
          echo "Key OK — fingerprint:"; ssh-keygen -lf "$KEYFILE"
          echo "path=$KEYFILE" >> "$GITHUB_OUTPUT"

      - name: Pull and restart the container on the server
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ env.IMAGE }}
          TAG: ${{ needs.image.outputs.tag }}
          CONTAINER: ${{ env.CONTAINER }}
          HOST_PORT: ${{ env.HOST_PORT }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key_path: ${{ steps.sshkey.outputs.path }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: GHCR_USER,GHCR_TOKEN,IMAGE,TAG,CONTAINER,HOST_PORT
          script_stop: true
          script: |
            set -e
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker pull "$IMAGE:$TAG"
            # Only this app's container is replaced; other containers on the host are untouched.
            docker rm -f "$CONTAINER" 2>/dev/null || true
            docker run -d --name "$CONTAINER" --restart unless-stopped \
              -p "$HOST_PORT:80" "$IMAGE:$TAG"
            docker logout ghcr.io
            # keep the last 3 images of this app, prune older ones
            docker images "$IMAGE" --format '{{.Tag}} {{.ID}}' | grep -v latest | tail -n +4 | awk '{print $2}' | xargs -r docker rmi || true
            for i in $(seq 1 15); do
              if wget -qO- "http://127.0.0.1:$HOST_PORT/healthz" >/dev/null 2>&1 || curl -fs "http://127.0.0.1:$HOST_PORT/healthz" >/dev/null 2>&1; then
                echo "Healthy on port $HOST_PORT"; exit 0
              fi
              sleep 2
            done
            echo "Container did not become healthy"; docker logs --tail 50 "$CONTAINER"; exit 1
